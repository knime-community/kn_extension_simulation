[workspace]
channels = ["knime", "conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[tasks]
test = { cmd = "pytest" }
format = { cmd = "ruff format ." }

[dependencies]
python = "3.13.*"
pytest = "*"
ruff = "*"
knime-extension = "*"
knime-python-base = "*"
knime-python-versions = "5.12.*"
pydoe3 = ">=1.4.0,<2"
scipy = ">=1.16.2,<2"
simpy = ">=4.1.1,<5"

[feature.build.dependencies]
python = "3.13.*"
knime-extension-bundling = "5.12.*"
pixi-pack = ">=0.7.7"

[feature.debug.dependencies]
debugpy = "*"

[feature.build.tasks]
build = { args = [{ "arg" = "dest", "default" = "./local-update-site" }, { "arg" = "update_sites_version", "default" = "5.12" }], cmd = "build-python-extension --disable-strict-enforcement . {{ dest }} --update-sites-version {{ update_sites_version }}" }
register-debug-in-knime = { description = "Register the current KNIME extension with a KNIME installation. Usage: 'pixi run register-debug-in-knime' (default locations) or 'pixi run register-debug-in-knime C:/' (search entire C: drive). Note windows paths should not end with \\ (backslash)", args = [{ "arg" = "search_path", "default" = "" }], cmd = "register-debug-in-knime{% if search_path %} --search-path \"{{ search_path }}\"{% endif %}" }

[environments]
build = {features = ["build"], no-default-feature = true}
debug = {features = ["debug"]}
